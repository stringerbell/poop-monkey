name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needs Pages already switched on with Source = GitHub Actions. The job's
      # GITHUB_TOKEN cannot create the Pages site itself — that takes repo admin,
      # which no workflow token has — so `enablement: true` only trades one error
      # for a more confusing one. See "Publishing" in the README for the one-off.
      - uses: actions/configure-pages@v5
      # The site is plain static files — no build step needed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
